name: "[DIAGNOSTIC] Consumer Android Release — No Shrink + No Impeller"

# TEMPORARY DIAGNOSTIC WORKFLOW — DO NOT MERGE TO main OR sprint/pilot-readiness-mvp
#
# DIAGNOSTIC STATE MACHINE:
#   RELEASE (default)              → camera FAILS  (original failure)
#   DEBUG                          → camera WORKS  (R8 not active)
#   RELEASE + --no-shrink          → camera FAILS  (R8 ruled out as root cause)
#   RELEASE + --no-shrink
#             + --no-enable-impeller → UNDER TEST
#
# PURPOSE:
#   Determine whether the Android Impeller rendering backend is interfering
#   with the CameraX/MobileScanner camera preview in RELEASE mode.
#
# WHAT IS NOT CHANGED:
#   - No application code (apps/consumer/lib/**)
#   - No pubspec.yaml
#   - No Android Gradle configuration (apps/consumer/android/**)
#   - No AndroidManifest.xml (Impeller disabled via build flag ONLY)
#   - No ProGuard rules
#   - No dependency versions
#   - No production workflow (.github/workflows/build-consumer-android.yml)
#
# DELETE THIS FILE after the isolation test is complete.

on:
  workflow_dispatch:

jobs:
  build-release-no-impeller:
    name: Build Release APK — No Shrink + No Impeller (Diagnostic)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Print Flutter version
        run: flutter --version

      # ── Replicates production workflow exactly ──────────────────────────────
      - name: Generate missing Android platform files
        working-directory: apps/consumer
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest_main.xml.bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create --org com.tajribti --platforms android --project-name consumer .
          cp /tmp/AndroidManifest_main.xml.bak android/app/src/main/AndroidManifest.xml
          cp /tmp/pubspec.yaml.bak pubspec.yaml

      - name: Verify AndroidManifest.xml preserved (unchanged)
        working-directory: apps/consumer
        run: |
          echo "=== AndroidManifest.xml ==="
          cat android/app/src/main/AndroidManifest.xml
          echo ""
          grep "CAMERA"   android/app/src/main/AndroidManifest.xml && echo "CAMERA permission: OK"   || echo "ERROR: CAMERA permission missing"
          grep "INTERNET"  android/app/src/main/AndroidManifest.xml && echo "INTERNET permission: OK" || echo "ERROR: INTERNET permission missing"
          grep "تجربتي"   android/app/src/main/AndroidManifest.xml && echo "App label (تجربتي): OK"  || echo "ERROR: App label missing"
          echo ""
          echo "Impeller meta-data lines (must be ABSENT — not set in source manifest):"
          grep -i "impeller" android/app/src/main/AndroidManifest.xml && echo "WARNING: Impeller entry found in manifest" || echo "OK: No Impeller entry in manifest (disabled via build flag only)"

      - name: Install Flutter dependencies
        working-directory: apps/consumer
        run: flutter pub get

      # ── Diagnostic dependency snapshot ──────────────────────────────────────
      - name: Print resolved dependency list
        working-directory: apps/consumer
        run: |
          echo "============================================================"
          echo "RESOLVED DEPENDENCY LIST"
          echo "============================================================"
          flutter pub deps --style=list
          echo ""
          echo "============================================================"
          echo "mobile_scanner resolved version"
          echo "============================================================"
          flutter pub deps --style=list | grep -i "mobile_scanner" || echo "mobile_scanner: not found"

      # ── Print diagnostic configuration clearly ──────────────────────────────
      - name: Print diagnostic configuration
        run: |
          echo ""
          echo "=== DIAGNOSTIC CONFIGURATION ==="
          echo "BUILD MODE: RELEASE"
          echo "SHRINKING:  DISABLED (--no-shrink)"
          echo "IMPELLER:   DISABLED (--no-enable-impeller)"
          echo "PROGUARD:   NOT ADDED"
          echo "GRADLE:     NOT MODIFIED"
          echo "SOURCE:     NOT MODIFIED"
          echo "MANIFEST:   NOT MODIFIED (Impeller off via build flag only)"
          echo "================================"
          echo ""

      # ── ISOLATION BUILD ─────────────────────────────────────────────────────
      - name: Build RELEASE APK — shrinking disabled + Impeller disabled
        working-directory: apps/consumer
        run: |
          flutter build apk --release \
            --no-shrink \
            --no-enable-impeller \
            --dart-define=API_BASE=https://api-production-266c.up.railway.app/api/v1

      # ── Verify APK ──────────────────────────────────────────────────────────
      - name: Verify APK exists
        run: |
          APK_PATH="apps/consumer/build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            echo "=== DIAGNOSTIC CONFIGURATION ==="
            echo "BUILD MODE: RELEASE"
            echo "SHRINKING:  DISABLED (--no-shrink)"
            echo "IMPELLER:   DISABLED (--no-enable-impeller)"
            echo "================================"
            echo ""
            echo "APK produced successfully:"
            ls -lh "$APK_PATH"
          else
            echo "ERROR: APK not found at expected path."
            find apps/consumer/build -name "*.apk" 2>/dev/null || echo "No APK found in build output."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tajribti-consumer-release-no-impeller-${{ github.run_number }}
          path: apps/consumer/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error
