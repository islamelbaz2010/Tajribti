<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TAJRIBTI — Company Workspace</title>
<style>
  :root { --primary:#EB6B45; --bg:#FAF1EB; --ink:#241914; --muted:#7a6a61; --card:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:16px 5vw; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #f1e6dc; }
  .logo { font-weight:800; text-decoration:none; color:var(--ink); }
  .logo span { color: var(--primary); }
  main { max-width: 960px; margin: 0 auto; padding: 24px 20px 60px; }
  .card { background: var(--card); border-radius: 16px; padding: 22px; margin-bottom: 16px; border:1px solid #f1e6dc; }
  h2 { margin-top:0; font-size:1.2rem; }
  label { display:block; font-size:0.85rem; color:var(--muted); margin:12px 0 4px; font-weight:600; }
  input, select, textarea {
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid #e6d9cf; font-size:0.92rem; background:#fff;
  }
  button { background: var(--primary); color:#fff; border:none; padding:10px 18px; border-radius:999px; font-weight:700; cursor:pointer; margin-top:14px; font-size:0.9rem; }
  button.secondary { background:#fff; color:var(--ink); border:1px solid #e6d9cf; }
  button.small { padding:6px 12px; font-size:0.8rem; margin-top:0; }
  .msg { font-size:0.85rem; margin-top:8px; }
  .msg.error { color:#b23b1e; } .msg.ok { color:#1e7a3d; }
  .hidden { display:none !important; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:700px) { .grid2 { grid-template-columns:1fr; } }
  table { width:100%; border-collapse:collapse; font-size:0.88rem; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid #f1e6dc; }
  .pill { display:inline-block; background:var(--bg); color:var(--primary); font-size:0.72rem; font-weight:700; padding:3px 10px; border-radius:999px; }
  .campaign-item { padding:14px; border:1px solid #f1e6dc; border-radius:12px; margin-bottom:10px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  .campaign-item:hover { border-color: var(--primary); }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .tab-btn { padding:8px 14px; border-radius:999px; border:1px solid #e6d9cf; background:#fff; color:var(--ink); cursor:pointer; font-size:0.85rem; font-weight:600; }
  .tab-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
  .metric { text-align:center; }
  .metric-num { font-size:1.5rem; font-weight:800; color:var(--primary); }
  .metric-label { font-size:0.75rem; color:var(--muted); }
  .metrics-row { display:flex; gap:20px; flex-wrap:wrap; margin-bottom: 10px; }
  .verbatim { padding:10px; border-left:3px solid var(--primary); background:var(--bg); margin-bottom:8px; font-size:0.88rem; border-radius:6px; }
  a.back { color: var(--muted); font-size: 0.85rem; text-decoration:none; display:inline-block; margin-bottom:10px; }
</style>
</head>
<body>
<header>
  <a href="/" class="logo">TAJRIBTI<span>.</span> <span style="font-weight:400;color:var(--muted);font-size:0.8rem;">Company</span></a>
  <div id="who" class="row"></div>
</header>
<main>

  <div id="view-login" class="card">
    <h2>Company sign in</h2>
    <label>Email</label>
    <input id="login-email" value="layla@nilefresh.example" />
    <label>Password</label>
    <input id="login-password" type="password" value="CompanyPass123!" />
    <button id="btn-login">Sign in</button>
    <div class="msg" id="login-msg"></div>
  </div>

  <div id="view-campaigns" class="hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <h2>Campaigns</h2>
        <button class="small" id="btn-new-campaign">+ New campaign</button>
      </div>
      <div id="campaign-list"></div>
    </div>

    <div class="card hidden" id="new-campaign-card">
      <h2>New campaign</h2>
      <!-- Founder-approved strategic differentiation (NOT Benchmark-
           required — see governance/FOUNDER_DECISION_STRATEGIC_
           DIFFERENTIATION.md): an optional "what are you trying to
           learn?" study-type tag, from the read-only catalog at
           GET /company/study-templates. Leaving it on "— custom —"
           reproduces the exact pre-existing campaign-creation behavior. -->
      <label>What are you trying to learn? (optional)</label>
      <select id="nc-studytype"><option value="">— custom, no template —</option></select>
      <p id="nc-studytype-decision" style="color:var(--muted);font-size:0.82rem;margin:0 0 8px;"></p>
      <label>Name</label><input id="nc-name" />
      <label>Objective</label><textarea id="nc-objective" rows="2"></textarea>
      <div class="grid2">
        <div><label>Start date</label><input id="nc-start" type="date" /></div>
        <div><label>End date</label><input id="nc-end" type="date" /></div>
      </div>
      <label>Product</label>
      <select id="nc-product"></select>
      <button id="btn-create-campaign">Create campaign</button>
      <div class="msg" id="nc-msg"></div>
    </div>

    <div class="card">
      <h2>Products</h2>
      <div id="product-list"></div>
      <!-- POST /company/products already accepts description/imageUrl
           (see api/src/routes/company.ts, api/prisma/schema.prisma
           Product model) — this form previously exposed only name,
           leaving Benchmark §4 COMPANY "Product / Assets" only
           partially usable. imageUrl is a plain URL string field, not
           a file-upload mechanism: the Benchmark names no upload
           methodology, so none is invented here. -->
      <label>New product name</label>
      <input id="np-name" />
      <label>Description (optional)</label>
      <textarea id="np-description" rows="2"></textarea>
      <label>Image URL (optional)</label>
      <input id="np-image" placeholder="https://…" />
      <button class="secondary small" id="btn-add-product">Add product</button>
    </div>

    <div class="card">
      <h2>Company profile</h2>
      <div class="grid2">
        <div><label>Company name</label><input id="cp-name" /></div>
        <div><label>Industry</label><input id="cp-industry" /></div>
      </div>
      <button class="small" id="btn-save-profile">Save</button>
      <div class="msg" id="cp-msg"></div>
    </div>

    <div class="card">
      <h2>Employees</h2>
      <div id="employee-list"></div>
      <div id="employee-add-form">
        <label>Name</label><input id="ne-name" />
        <label>Email</label><input id="ne-email" />
        <label>Password</label><input id="ne-password" type="password" />
        <button class="secondary small" id="btn-add-employee">Add employee</button>
      </div>
      <p class="msg" id="employee-msg"></p>
    </div>
  </div>

  <div id="view-campaign-detail" class="hidden">
    <a href="#" id="btn-back" class="back">← Back to campaigns</a>
    <div class="card">
      <span class="pill" id="cd-status"></span>
      <span class="pill hidden" id="cd-studytype" style="background:#fff;border:1px solid #e6d9cf;color:var(--ink);"></span>
      <h2 id="cd-name"></h2>
      <p id="cd-objective" style="color:var(--muted);"></p>
      <div class="row" id="cd-actions"></div>
      <div class="msg" id="cd-msg"></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="setup">Setup</button>
      <button class="tab-btn" data-tab="questions">Journey / Survey</button>
      <button class="tab-btn" data-tab="qr">QR / Sources</button>
      <button class="tab-btn" data-tab="live">Live Results</button>
      <button class="tab-btn" data-tab="insights">Insights</button>
      <button class="tab-btn" data-tab="report">Report</button>
    </div>

    <div class="card tab-panel" id="tab-setup">
      <h2>Campaign setup</h2>
      <!-- Benchmark §5 names Objective, Product, Audience and Dates as core
           Campaign components, and §2.4 requires a real "Configure" stage
           before Launch/Active — not a create-once record. PATCH
           /company/campaigns/:id already accepts name/objective/productId/
           dates (see api/src/routes/company.ts), gated to DRAFT/READY by
           the same assertConfigurable() lock as every other setup action
           on this tab; only the UI previously exposed audience fields
           here, leaving the rest of Configure editable only at creation
           time. No new backend behavior — this only wires the existing
           endpoint's already-accepted fields into the Setup tab. -->
      <label>Campaign name</label><input id="s-name" />
      <label>Objective</label><textarea id="s-objective" rows="2"></textarea>
      <div class="grid2">
        <div><label>Start date</label><input id="s-start" type="date" /></div>
        <div><label>End date</label><input id="s-end" type="date" /></div>
      </div>
      <label>Product</label>
      <select id="s-product"></select>
      <!-- Founder-approved strategic differentiation, not Benchmark-
           required (see governance/FOUNDER_DECISION_STRATEGIC_
           DIFFERENTIATION.md) — same optional study-type tag as the New
           Campaign form, editable here too via the same PATCH endpoint. -->
      <label>What are you trying to learn? (optional)</label>
      <select id="s-studytype"><option value="">— custom, no template —</option></select>
      <p id="s-studytype-decision" style="color:var(--muted);font-size:0.82rem;margin:0 0 8px;"></p>
      <h3 style="font-size:0.95rem;">Audience</h3>
      <div class="grid2">
        <div><label>Min age</label><input id="s-agemin" type="number" /></div>
        <div><label>Max age</label><input id="s-agemax" type="number" /></div>
      </div>
      <div class="grid2">
        <div><label>Gender</label><select id="s-gender"><option value="ANY">Any</option><option value="MALE">Male</option><option value="FEMALE">Female</option></select></div>
        <div><label>City</label><input id="s-city" /></div>
      </div>
      <button id="btn-save-setup">Save</button>
      <div class="msg" id="setup-msg"></div>
    </div>

    <div class="card tab-panel hidden" id="tab-questions">
      <h2>Eligibility &amp; post-trial questions</h2>
      <!-- Founder-approved strategic differentiation (NOT Benchmark-
           required): if this campaign has a study type selected, offer
           to bulk-create its recommended questions through the exact
           same question-creation path "Add question" below uses. Hidden
           when no study type is set — behaves identically to the
           pre-existing product otherwise. -->
      <div id="template-apply-row" class="msg hidden" style="margin-bottom:10px;"></div>
      <div id="question-list"></div>
      <h3 style="font-size:0.95rem;">Add question</h3>
      <label>Stage</label>
      <select id="q-stage"><option value="ELIGIBILITY">Eligibility (screener)</option><option value="POST_TRIAL">Post-trial (survey)</option></select>
      <label>Type</label>
      <select id="q-type">
        <option value="SINGLE_CHOICE">Single choice</option>
        <option value="MULTI_CHOICE">Multiple choice</option>
        <option value="TEXT">Open text</option>
        <option value="RATING_1_5">Rating (1-5)</option>
        <option value="PURCHASE_INTENT_1_5">Purchase intent (1-5)</option>
      </select>
      <label>Question text</label>
      <input id="q-text" />
      <label>Options (comma-separated, for choice types)</label>
      <input id="q-options" placeholder="Yes, No" />
      <button id="btn-add-question">Add question</button>
      <div class="msg" id="question-msg"></div>
    </div>

    <div class="card tab-panel hidden" id="tab-qr">
      <h2>QR / Sources</h2>
      <div id="qr-list"></div>
      <label>Label</label><input id="qr-label" />
      <label>Code</label><input id="qr-code" />
      <div class="grid2">
        <div><label>Active from</label><input id="qr-from" type="date" /></div>
        <div><label>Active to</label><input id="qr-to" type="date" /></div>
      </div>
      <button id="btn-add-qr">Add QR/source</button>
      <div class="msg" id="qr-msg"></div>
    </div>

    <div class="card tab-panel hidden" id="tab-live">
      <h2>Live results</h2>
      <div id="live-content"></div>
    </div>

    <div class="card tab-panel hidden" id="tab-insights">
      <h2>Insights</h2>
      <div id="insights-content"></div>
    </div>

    <div class="card tab-panel hidden" id="tab-report">
      <h2>Final report</h2>
      <div id="report-content"></div>
    </div>
  </div>

</main>

<script>
const API = '/api';
let token = localStorage.getItem('tj_company_token') || null;
let currentCampaignId = null;
let currentCampaignStudyType = '';
let studyTemplates = []; // cached from GET /company/study-templates

// Security hardening: company/product/campaign/employee names, question
// text, option labels, QR labels and consumer survey verbatims all
// originate from user input (Company or Consumer) and are persisted,
// unsanitized, at write time. esc() HTML-entity-escapes every dynamic
// value before it is placed into an innerHTML string; static markup
// around it is untouched.
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[ch]));
}

function authHeaders() { return token ? { Authorization: 'Bearer ' + token } : {}; }
async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...authHeaders(), ...(opts.headers || {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('Request failed (' + res.status + ')'));
  return data;
}
function show(id) {
  ['view-login','view-campaigns','view-campaign-detail'].forEach(v => document.getElementById(v).classList.toggle('hidden', v !== id));
}

document.getElementById('btn-login').onclick = async () => {
  const msg = document.getElementById('login-msg');
  try {
    const r = await api('/company/auth/login', { method: 'POST', body: {
      email: document.getElementById('login-email').value.trim(),
      password: document.getElementById('login-password').value,
    }});
    token = r.token;
    localStorage.setItem('tj_company_token', token);
    document.getElementById('who').textContent = r.employee.name;
    await loadCampaigns();
  } catch (e) { msg.textContent = e.message; msg.className = 'msg error'; }
};

async function loadProducts(selectEl) {
  const products = await api('/company/products');
  document.getElementById('product-list').innerHTML = products.map(p =>
    '<div>• ' + esc(p.name) + (p.description ? ' <span style="color:var(--muted);font-size:0.85rem;">— ' + esc(p.description) + '</span>' : '') + '</div>'
  ).join('') || '<p style="color:var(--muted)">No products yet.</p>';
  if (selectEl) {
    selectEl.innerHTML = '<option value="">— none —</option>' + products.map(p => '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>').join('');
  }
  return products;
}

document.getElementById('btn-add-product').onclick = async () => {
  const name = document.getElementById('np-name').value.trim();
  if (!name) return;
  await api('/company/products', { method: 'POST', body: {
    name,
    description: document.getElementById('np-description').value.trim() || undefined,
    imageUrl: document.getElementById('np-image').value.trim() || undefined,
  }});
  document.getElementById('np-name').value = '';
  document.getElementById('np-description').value = '';
  document.getElementById('np-image').value = '';
  await loadProducts(document.getElementById('nc-product'));
};

async function loadCampaigns() {
  const campaigns = await api('/company/campaigns');
  const list = document.getElementById('campaign-list');
  list.innerHTML = campaigns.length ? '' : '<p style="color:var(--muted)">No campaigns yet — create one below.</p>';
  campaigns.forEach(c => {
    const div = document.createElement('div');
    div.className = 'campaign-item';
    div.innerHTML = '<div><strong>' + esc(c.name) + '</strong><div style="color:var(--muted);font-size:0.85rem;">' + (c.product ? esc(c.product.name) : 'No product linked') + '</div></div><span class="pill">' + c.status + '</span>';
    div.onclick = () => openCampaign(c.id);
    list.appendChild(div);
  });
  await loadProducts(document.getElementById('nc-product'));
  await loadStudyTemplates();
  await loadProfile();
  await loadEmployees();
  show('view-campaigns');
}

// --- Company Profile (Benchmark §4 COMPANY "Company Profile") --------------
async function loadProfile() {
  const c = await api('/company/profile');
  document.getElementById('cp-name').value = c.name || '';
  document.getElementById('cp-industry').value = c.industry || '';
}
document.getElementById('btn-save-profile').onclick = async () => {
  const msg = document.getElementById('cp-msg');
  try {
    await api('/company/profile', { method: 'PATCH', body: {
      name: document.getElementById('cp-name').value.trim(),
      industry: document.getElementById('cp-industry').value.trim() || undefined,
    }});
    msg.textContent = 'Saved.'; msg.className = 'msg ok';
  } catch (e) { msg.textContent = e.message; msg.className = 'msg error'; }
};

// --- Employees (Benchmark §4 COMPANY "Employees") ---------------------------
async function loadEmployees() {
  const employees = await api('/company/employees');
  document.getElementById('employee-list').innerHTML = employees.length ?
    '<table><tr><th>Name</th><th>Email</th></tr>' +
    employees.map(e => '<tr><td>' + esc(e.name) + '</td><td>' + esc(e.email) + '</td></tr>').join('') + '</table>'
    : '<p style="color:var(--muted)">No employees yet.</p>';
  // No role gate: Benchmark defines no employee permission tier — any
  // employee of this company may add another (see api/src/routes/company.ts).
}
document.getElementById('btn-add-employee').onclick = async () => {
  const msg = document.getElementById('employee-msg');
  try {
    await api('/company/employees', { method: 'POST', body: {
      name: document.getElementById('ne-name').value.trim(),
      email: document.getElementById('ne-email').value.trim(),
      password: document.getElementById('ne-password').value,
    }});
    document.getElementById('ne-name').value = '';
    document.getElementById('ne-email').value = '';
    document.getElementById('ne-password').value = '';
    msg.textContent = 'Employee added.'; msg.className = 'msg ok';
    await loadEmployees();
  } catch (e) { msg.textContent = e.message; msg.className = 'msg error'; }
};

// Founder-approved strategic differentiation, not Benchmark-required
// (see governance/FOUNDER_DECISION_STRATEGIC_DIFFERENTIATION.md).
async function loadStudyTemplates() {
  if (studyTemplates.length) return studyTemplates;
  studyTemplates = await api('/company/study-templates');
  const opts = studyTemplates.map(t => '<option value="' + esc(t.key) + '">' + esc(t.label) + '</option>').join('');
  document.getElementById('nc-studytype').insertAdjacentHTML('beforeend', opts);
  document.getElementById('s-studytype').insertAdjacentHTML('beforeend', opts);
  return studyTemplates;
}
function studyTemplateDecisionText(key) {
  const t = studyTemplates.find(x => x.key === key);
  return t ? t.decision : '';
}
document.getElementById('nc-studytype').onchange = (e) => {
  document.getElementById('nc-studytype-decision').textContent = studyTemplateDecisionText(e.target.value);
};

document.getElementById('btn-new-campaign').onclick = () => document.getElementById('new-campaign-card').classList.toggle('hidden');

document.getElementById('btn-create-campaign').onclick = async () => {
  const msg = document.getElementById('nc-msg');
  try {
    const c = await api('/company/campaigns', { method: 'POST', body: {
      name: document.getElementById('nc-name').value.trim(),
      objective: document.getElementById('nc-objective').value.trim(),
      startDate: document.getElementById('nc-start').value,
      endDate: document.getElementById('nc-end').value,
      productId: document.getElementById('nc-product').value || undefined,
      studyType: document.getElementById('nc-studytype').value || undefined,
    }});
    document.getElementById('new-campaign-card').classList.add('hidden');
    await loadCampaigns();
    openCampaign(c.id);
  } catch (e) { msg.textContent = e.message; msg.className = 'msg error'; }
};

document.getElementById('btn-back').onclick = (e) => { e.preventDefault(); loadCampaigns(); };

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
    document.getElementById('tab-' + btn.dataset.tab).classList.remove('hidden');
    if (btn.dataset.tab === 'live') loadLive();
    if (btn.dataset.tab === 'insights') loadInsights();
    if (btn.dataset.tab === 'report') loadReport();
  };
});

async function openCampaign(id) {
  currentCampaignId = id;
  const c = await api('/company/campaigns/' + id);
  document.getElementById('cd-status').textContent = c.status;
  document.getElementById('cd-name').textContent = c.name;
  document.getElementById('cd-objective').textContent = c.objective;
  document.getElementById('s-name').value = c.name || '';
  document.getElementById('s-objective').value = c.objective || '';
  document.getElementById('s-start').value = c.startDate ? c.startDate.slice(0, 10) : '';
  document.getElementById('s-end').value = c.endDate ? c.endDate.slice(0, 10) : '';
  await loadProducts(document.getElementById('s-product'));
  document.getElementById('s-product').value = c.productId || '';
  await loadStudyTemplates();
  document.getElementById('s-studytype').value = c.studyType || '';
  document.getElementById('s-studytype-decision').textContent = studyTemplateDecisionText(c.studyType || '');
  currentCampaignStudyType = c.studyType || '';
  const badge = document.getElementById('cd-studytype');
  const tpl = studyTemplates.find(t => t.key === c.studyType);
  badge.textContent = tpl ? tpl.label : '';
  badge.classList.toggle('hidden', !tpl);
  document.getElementById('s-agemin').value = c.audienceAgeMin || '';
  document.getElementById('s-agemax').value = c.audienceAgeMax || '';
  document.getElementById('s-gender').value = c.audienceGender || 'ANY';
  document.getElementById('s-city').value = c.audienceCity || '';

  // UI/UX lock fix: PATCH /company/campaigns/:id has always correctly
  // rejected edits once a campaign leaves DRAFT/READY (assertConfigurable
  // in api/src/routes/company.ts — verified: 409, zero DB change) and the
  // Setup form has always correctly surfaced that rejection's error
  // message on Save. What was missing is any visual indication *before*
  // the attempt — every field rendered as a normal, enabled input for an
  // ACTIVE/PAUSED/COMPLETED campaign, indistinguishable from an editable
  // DRAFT/READY one. This only toggles `disabled` on the same fields and
  // hides Save; it does not change what the backend already enforces.
  const setupLocked = c.status !== 'DRAFT' && c.status !== 'READY';
  ['s-name', 's-objective', 's-start', 's-end', 's-product', 's-studytype', 's-agemin', 's-agemax', 's-gender', 's-city']
    .forEach(id => { document.getElementById(id).disabled = setupLocked; });
  document.getElementById('btn-save-setup').classList.toggle('hidden', setupLocked);
  const setupMsg = document.getElementById('setup-msg');
  if (setupLocked) {
    setupMsg.textContent = 'Configuration is locked once launched — view only.';
    setupMsg.className = 'msg';
  } else {
    setupMsg.textContent = ''; setupMsg.className = 'msg';
  }

  const actions = document.getElementById('cd-actions');
  actions.innerHTML = '';
  if (c.status === 'DRAFT') {
    const b = document.createElement('button'); b.className='small'; b.textContent = 'Submit for review';
    b.onclick = async () => {
      const msg = document.getElementById('cd-msg');
      try { await api('/company/campaigns/' + id + '/submit-for-review', { method: 'POST' }); openCampaign(id); }
      catch (e) { msg.textContent = e.message; msg.className='msg error'; }
    };
    actions.appendChild(b);
  } else if (c.status === 'READY') {
    // No "revert to draft" action — Benchmark names no reverse transition
    // in the Configure -> Review/Ready chain (see api/src/routes/company.ts).
    const note = document.createElement('span'); note.style.cssText='color:var(--muted);font-size:0.85rem;'; note.textContent = 'Ready — awaiting TAJRIBTI Operations launch.';
    actions.appendChild(note);
  }

  renderQuestions(c.questions || []);
  renderTemplateApplyRow();
  renderQrSources(c.qrSources || []);

  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.tab-btn[data-tab="setup"]').classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
  document.getElementById('tab-setup').classList.remove('hidden');

  show('view-campaign-detail');
}

document.getElementById('btn-save-setup').onclick = async () => {
  const msg = document.getElementById('setup-msg');
  try {
    const updated = await api('/company/campaigns/' + currentCampaignId, { method: 'PATCH', body: {
      name: document.getElementById('s-name').value.trim() || undefined,
      objective: document.getElementById('s-objective').value.trim() || undefined,
      startDate: document.getElementById('s-start').value || undefined,
      endDate: document.getElementById('s-end').value || undefined,
      productId: document.getElementById('s-product').value || undefined,
      audienceAgeMin: Number(document.getElementById('s-agemin').value) || undefined,
      audienceAgeMax: Number(document.getElementById('s-agemax').value) || undefined,
      audienceGender: document.getElementById('s-gender').value,
      audienceCity: document.getElementById('s-city').value.trim() || undefined,
      studyType: document.getElementById('s-studytype').value || undefined,
    }});
    document.getElementById('cd-name').textContent = updated.name;
    document.getElementById('cd-objective').textContent = updated.objective;
    currentCampaignStudyType = updated.studyType || '';
    const badge = document.getElementById('cd-studytype');
    const tpl = studyTemplates.find(t => t.key === updated.studyType);
    badge.textContent = tpl ? tpl.label : '';
    badge.classList.toggle('hidden', !tpl);
    renderTemplateApplyRow();
    msg.textContent = 'Saved.'; msg.className = 'msg ok';
  } catch (e) { msg.textContent = e.message; msg.className = 'msg error'; }
};

function renderQuestions(questions) {
  const list = document.getElementById('question-list');
  list.innerHTML = questions.length ? '<table><tr><th>Stage</th><th>Type</th><th>Text</th><th></th></tr>' +
    questions.map(q => '<tr><td>' + q.stage + '</td><td>' + q.type + '</td><td>' + esc(q.text) + '</td></tr>').join('') + '</table>'
    : '<p style="color:var(--muted)">No questions yet.</p>';
}

// Founder-approved strategic differentiation, not Benchmark-required
// (see governance/FOUNDER_DECISION_STRATEGIC_DIFFERENTIATION.md).
// Offers to bulk-create the selected study template's recommended
// questions through the same question-creation path as "Add question"
// above. Hidden entirely when no study type is set on this campaign —
// the tab behaves exactly like the pre-existing product in that case.
function renderTemplateApplyRow() {
  const row = document.getElementById('template-apply-row');
  const tpl = studyTemplates.find(t => t.key === currentCampaignStudyType);
  if (!tpl) { row.classList.add('hidden'); row.innerHTML = ''; return; }
  row.classList.remove('hidden');
  row.className = 'msg';
  // GET /company/study-templates intentionally returns `questionCount`
  // (a number), not the full `questions` array — the catalog listing
  // doesn't need each template's full question bodies, only apply-template
  // does, and that's a POST with the full server-side catalog behind it.
  // Reading `tpl.questions.length` here (an earlier version's bug) throws
  // because `tpl.questions` is undefined on this response shape.
  row.innerHTML = '<strong>' + esc(tpl.label) + '</strong> — ' + esc(tpl.decision) +
    ' <button class="small secondary" id="btn-apply-template" style="margin-left:8px;">Apply recommended questions (' + tpl.questionCount + ')</button>';
  document.getElementById('btn-apply-template').onclick = async () => {
    try {
      const result = await api('/company/campaigns/' + currentCampaignId + '/questions/apply-template', { method: 'POST', body: { templateKey: tpl.key } });
      const c = await api('/company/campaigns/' + currentCampaignId);
      renderQuestions(c.questions || []);
      row.className = result.created.length ? 'msg ok' : 'msg';
      row.innerHTML = (result.created.length ? 'Added ' + result.created.length + ' question(s).' : 'No new questions added.') +
        (result.skipped.length ? ' Skipped ' + result.skipped.length + ' (already present on this campaign, or would duplicate a rating/purchase-intent question that already exists — combining two of those would blend unrelated averages).' : '');
    } catch (e) {
      row.className = 'msg error'; row.textContent = e.message;
    }
  };
}

document.getElementById('btn-add-question').onclick = async () => {
  const msg = document.getElementById('question-msg');
  const type = document.getElementById('q-type').value;
  const optionsRaw = document.getElementById('q-options').value.trim();
  const options = optionsRaw ? optionsRaw.split(',').map((s, i) => ({ id: 'opt' + i, label: s.trim() })) : undefined;
  try {
    await api('/company/campaigns/' + currentCampaignId + '/questions', { method: 'POST', body: {
      stage: document.getElementById('q-stage').value,
      type, text: document.getElementById('q-text').value.trim(),
      options, order: Date.now() % 1000,
    }});
    document.getElementById('q-text').value = ''; document.getElementById('q-options').value = '';
    const c = await api('/company/campaigns/' + currentCampaignId);
    renderQuestions(c.questions);
    msg.textContent = 'Question added.'; msg.className = 'msg ok';
  } catch (e) { msg.textContent = e.message; msg.className = 'msg error'; }
};

function renderQrSources(sources) {
  const list = document.getElementById('qr-list');
  list.innerHTML = sources.length ? '<table><tr><th>Label</th><th>Code</th><th>Active window</th></tr>' +
    sources.map(s => '<tr><td>' + esc(s.label) + '</td><td>' + esc(s.code) + '</td><td>' + new Date(s.activeFrom).toLocaleDateString() + ' – ' + new Date(s.activeTo).toLocaleDateString() + '</td></tr>').join('') + '</table>'
    : '<p style="color:var(--muted)">No QR/sources yet.</p>';
}

document.getElementById('btn-add-qr').onclick = async () => {
  const msg = document.getElementById('qr-msg');
  try {
    await api('/company/campaigns/' + currentCampaignId + '/qr-sources', { method: 'POST', body: {
      label: document.getElementById('qr-label').value.trim(),
      code: document.getElementById('qr-code').value.trim(),
      activeFrom: document.getElementById('qr-from').value,
      activeTo: document.getElementById('qr-to').value,
    }});
    const c = await api('/company/campaigns/' + currentCampaignId);
    renderQrSources(c.qrSources);
    msg.textContent = 'QR/source added.'; msg.className = 'msg ok';
  } catch (e) { msg.textContent = e.message; msg.className = 'msg error'; }
};

async function loadLive() {
  const data = await api('/company/campaigns/' + currentCampaignId + '/live');
  document.getElementById('live-content').innerHTML =
    '<div class="metrics-row">' +
    metric(data.funnel.entered, 'Entered') + metric(data.funnel.eligible, 'Eligible') +
    metric(data.funnel.trialRedeemed, 'Trial redeemed') + metric(data.funnel.surveyComplete, 'Survey complete') +
    '</div>' +
    '<h3 style="font-size:0.95rem;">Purchase intent</h3><p>' + (data.purchaseIntent.averageScore ?? '—') + ' / 5 (' + data.purchaseIntent.responses + ' responses)</p>' +
    '<h3 style="font-size:0.95rem;">Satisfaction</h3><p>' + (data.satisfaction.averageScore ?? '—') + ' / 5 (' + data.satisfaction.responses + ' responses)</p>' +
    '<h3 style="font-size:0.95rem;">Sources</h3><table><tr><th>Source</th><th>Entered</th><th>Trial redeemed</th><th>Survey complete</th></tr>' +
    data.sources.map(s => '<tr><td>' + esc(s.label) + '</td><td>' + s.entered + '</td><td>' + s.trialRedeemed + '</td><td>' + s.surveyComplete + '</td></tr>').join('') + '</table>';
}
function metric(n, label) { return '<div class="metric"><div class="metric-num">' + n + '</div><div class="metric-label">' + label + '</div></div>'; }

async function loadInsights() {
  const data = await api('/company/campaigns/' + currentCampaignId + '/insights');
  document.getElementById('insights-content').innerHTML =
    '<p style="color:var(--muted);font-size:0.85rem;">Evidence level: <strong>' + data.evidence.level + '</strong> (sample size ' + data.evidence.sampleSize + ')</p>' +
    '<h3 style="font-size:0.95rem;">Purchase intent</h3><p>' + (data.purchaseIntent.averageScore ?? '—') + ' / 5</p>' +
    '<h3 style="font-size:0.95rem;">Satisfaction</h3><p>' + (data.satisfaction.averageScore ?? '—') + ' / 5</p>' +
    '<h3 style="font-size:0.95rem;">Campaign-specific questions</h3>' +
    data.questionAggregates.map(q => '<p><strong>' + esc(q.text) + '</strong><br/>' + q.breakdown.map(b => esc(b.label) + ': ' + b.count).join(' · ') + '</p>').join('') +
    '<h3 style="font-size:0.95rem;">Consumer voice</h3>' +
    (data.verbatims.length ? data.verbatims.map(v => '<div class="verbatim">"' + esc(v.response) + '"<br/><span style="color:var(--muted);font-size:0.78rem;">' + esc(v.question) + '</span></div>').join('') : '<p style="color:var(--muted)">No open-text responses yet.</p>');
}

// Renders every category buildReport() (api/src/lib/report.ts) returns.
// Benchmark §7 "Required evidence categories" lists campaign identity,
// product, dates, participant/trial metrics, sample size, demographics,
// product/experience feedback, purchase intent, campaign-specific
// questions, consumer verbatims, findings, recommendations, methodology
// and limitations; §3 additionally requires source/channel performance
// to be operationally visible. The backend already computes all of
// these for this exact endpoint — this function previously rendered
// only a subset (findings, recommendations, a partial demographics line,
// methodology, limitations), leaving the rest of the already-authorized,
// already-computed report data invisible to the company. No new
// backend computation or methodology is introduced here; this only
// wires existing fields into the one display surface built for them.
function breakdownLine(counts) {
  const keys = Object.keys(counts);
  return keys.length ? keys.map(k => esc(k) + ': ' + counts[k]).join(' · ') : '—';
}

async function loadReport() {
  const r = await api('/company/campaigns/' + currentCampaignId + '/report');
  document.getElementById('report-content').innerHTML =
    '<p style="color:var(--muted);font-size:0.85rem;">Generated ' + new Date(r.generatedAt).toLocaleString() + ' · Evidence level: <strong>' + r.evidence.level + '</strong> (sample size ' + r.evidence.sampleSize + ')</p>' +
    '<h3 style="font-size:0.95rem;">Campaign</h3><p>' + esc(r.campaign.name) + ' — ' + esc(r.campaign.objective) + '<br/>' +
    'Product: ' + (r.campaign.product ? esc(r.campaign.product) : 'No product linked') + '<br/>' +
    'Dates: ' + new Date(r.campaign.startDate).toLocaleDateString() + ' – ' + new Date(r.campaign.endDate).toLocaleDateString() + '<br/>' +
    'Status: ' + esc(r.campaign.status) +
    (r.campaign.studyType ? '<br/>Study type: ' + esc((studyTemplates.find(t => t.key === r.campaign.studyType) || {}).label || r.campaign.studyType) : '') + '</p>' +
    '<h3 style="font-size:0.95rem;">Participant / trial metrics</h3>' +
    '<div class="metrics-row">' +
    metric(r.funnel.entered, 'Entered') + metric(r.funnel.eligible, 'Eligible') +
    metric(r.funnel.trialRedeemed, 'Trial redeemed') + metric(r.funnel.surveyComplete, 'Survey complete') +
    '</div>' +
    '<h3 style="font-size:0.95rem;">Sources</h3>' +
    (r.sources.length ? '<table><tr><th>Source</th><th>Entered</th><th>Trial redeemed</th><th>Survey complete</th></tr>' +
      r.sources.map(s => '<tr><td>' + esc(s.label) + '</td><td>' + s.entered + '</td><td>' + s.trialRedeemed + '</td><td>' + s.surveyComplete + '</td></tr>').join('') + '</table>'
      : '<p style="color:var(--muted)">No QR/sources configured for this campaign.</p>') +
    '<h3 style="font-size:0.95rem;">Demographics</h3><p>Sample size: ' + r.demographics.sampleSize + ', average age: ' + (r.demographics.averageAge ?? '—') + '<br/>' +
    'Gender: ' + breakdownLine(r.demographics.genderBreakdown) + '<br/>' +
    'City: ' + breakdownLine(r.demographics.cityBreakdown) + '</p>' +
    '<h3 style="font-size:0.95rem;">Purchase intent</h3><p>' + (r.purchaseIntent.averageScore ?? '—') + ' / 5 (' + r.purchaseIntent.responses + ' responses)</p>' +
    '<h3 style="font-size:0.95rem;">Satisfaction</h3><p>' + (r.satisfaction.averageScore ?? '—') + ' / 5 (' + r.satisfaction.responses + ' responses)</p>' +
    '<h3 style="font-size:0.95rem;">Campaign-specific questions</h3>' +
    (r.campaignSpecificQuestions.length ? r.campaignSpecificQuestions.map(q => '<p><strong>' + esc(q.text) + '</strong> (' + q.responses + ' responses)<br/>' + q.breakdown.map(b => esc(b.label) + ': ' + b.count).join(' · ') + '</p>').join('') : '<p style="color:var(--muted)">No choice-question responses yet.</p>') +
    '<h3 style="font-size:0.95rem;">Consumer voice</h3>' +
    (r.consumerVoice.length ? r.consumerVoice.map(v => '<div class="verbatim">"' + esc(v.response) + '"<br/><span style="color:var(--muted);font-size:0.78rem;">' + esc(v.question) + '</span></div>').join('') : '<p style="color:var(--muted)">No open-text responses yet.</p>') +
    '<h3 style="font-size:0.95rem;">Findings</h3><ul>' + r.findings.map(f => '<li>' + esc(f) + '</li>').join('') + '</ul>' +
    '<h3 style="font-size:0.95rem;">Recommendations</h3><ul>' + (r.recommendations.length ? r.recommendations.map(f => '<li>' + esc(f) + '</li>').join('') : '<li>None yet — insufficient evidence.</li>') + '</ul>' +
    '<h3 style="font-size:0.95rem;">Methodology</h3><p style="color:var(--muted);font-size:0.85rem;">' + esc(r.methodology) + '</p>' +
    '<h3 style="font-size:0.95rem;">Limitations</h3><ul>' + r.limitations.map(l => '<li>' + esc(l) + '</li>').join('') + '</ul>';
}

(async () => {
  if (token) {
    try { await loadCampaigns(); return; } catch { localStorage.removeItem('tj_company_token'); token = null; }
  }
  show('view-login');
})();
</script>
