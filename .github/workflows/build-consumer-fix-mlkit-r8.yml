name: Consumer Android APK — Fix MLKit R8 (fix/consumer-mlkit-r8)

# Builds the release APK with ML Kit ProGuard keep rules applied.
# Run this workflow to produce the APK for device testing.
# Do NOT merge this workflow to sprint/pilot-readiness-mvp or main
# until the fix is confirmed on the physical OPPO CPH2481 device.

on:
  workflow_dispatch:
  push:
    branches:
      - fix/consumer-mlkit-r8
    paths:
      - 'apps/consumer/**'
      - '.github/workflows/build-consumer-fix-mlkit-r8.yml'

jobs:
  build-android:
    name: Build Release APK (ML Kit R8 Fix)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Generate missing Android platform files
        working-directory: apps/consumer
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest_main.xml.bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create --org com.tajribti --platforms android --project-name consumer .
          cp /tmp/AndroidManifest_main.xml.bak android/app/src/main/AndroidManifest.xml
          cp /tmp/pubspec.yaml.bak pubspec.yaml

      - name: Verify AndroidManifest.xml preserved
        working-directory: apps/consumer
        run: |
          echo "=== AndroidManifest.xml ==="
          cat android/app/src/main/AndroidManifest.xml
          grep "CAMERA"   android/app/src/main/AndroidManifest.xml && echo "CAMERA permission: OK"   || echo "ERROR: CAMERA permission missing"
          grep "INTERNET"  android/app/src/main/AndroidManifest.xml && echo "INTERNET permission: OK" || echo "ERROR: INTERNET permission missing"
          grep "تجربتي"   android/app/src/main/AndroidManifest.xml && echo "App label (تجربتي): OK"  || echo "ERROR: App label missing"

      - name: Verify ProGuard rules file is present
        working-directory: apps/consumer
        run: |
          echo "=== proguard-rules.pro ==="
          cat android/app/proguard-rules.pro
          echo ""
          echo "=== build.gradle.kts release block ==="
          grep -A 5 "release {" android/app/build.gradle.kts

      - name: Install Flutter dependencies
        working-directory: apps/consumer
        run: flutter pub get

      - name: Print resolved mobile_scanner version
        working-directory: apps/consumer
        run: |
          flutter pub deps --style=list | grep -i "mobile_scanner" || echo "mobile_scanner: not found"

      - name: Build release APK
        working-directory: apps/consumer
        run: |
          flutter build apk --release \
            --dart-define=API_BASE=https://api-production-266c.up.railway.app/api/v1

      - name: Verify APK exists and record size
        run: |
          APK_PATH="apps/consumer/build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            echo "APK produced successfully."
            ls -lh "$APK_PATH"
          else
            echo "ERROR: APK not found."
            find apps/consumer/build -name "*.apk" 2>/dev/null || echo "No APK found."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tajribti-consumer-fix-mlkit-r8-${{ github.run_number }}
          path: apps/consumer/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
