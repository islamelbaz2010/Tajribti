name: "[DIAGNOSTIC] Consumer Android Debug APK"

# TEMPORARY DIAGNOSTIC WORKFLOW — DO NOT MERGE TO main OR sprint/pilot-readiness-mvp
#
# PURPOSE:
#   Build a debug APK to determine whether the release camera failure is caused
#   by R8 code-shrinking stripping ML Kit ComponentRegistrar classes.
#
# HYPOTHESIS UNDER TEST:
#   Release APK: camera preview fails → NoSuchMethodException on ML Kit registrars
#   Debug APK:   R8 not active → if camera works, R8 is confirmed as root cause
#
# DELETE THIS FILE after the diagnostic test is complete.

on:
  workflow_dispatch:

jobs:
  build-debug-diagnostic:
    name: Build Debug APK (Diagnostic — Not For Production)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Generate missing Android platform files
        working-directory: apps/consumer
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest_main.xml.bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create --org com.tajribti --platforms android --project-name consumer .
          cp /tmp/AndroidManifest_main.xml.bak android/app/src/main/AndroidManifest.xml
          cp /tmp/pubspec.yaml.bak pubspec.yaml

      - name: Verify AndroidManifest.xml preserved
        working-directory: apps/consumer
        run: |
          echo "=== AndroidManifest.xml ==="
          cat android/app/src/main/AndroidManifest.xml
          echo ""
          grep "CAMERA" android/app/src/main/AndroidManifest.xml && echo "CAMERA permission: OK" || echo "ERROR: CAMERA permission missing"
          grep "INTERNET" android/app/src/main/AndroidManifest.xml && echo "INTERNET permission: OK" || echo "ERROR: INTERNET permission missing"
          grep "تجربتي" android/app/src/main/AndroidManifest.xml && echo "App label (تجربتي): OK" || echo "ERROR: App label missing"

      - name: Install Flutter dependencies
        working-directory: apps/consumer
        run: flutter pub get

      # ── DIAGNOSTIC: Print full dependency tree ──────────────────────────────
      - name: Print resolved dependency tree (diagnostic)
        working-directory: apps/consumer
        run: |
          echo "============================================================"
          echo "RESOLVED DEPENDENCY TREE"
          echo "============================================================"
          flutter pub deps --style=tree
          echo ""
          echo "============================================================"
          echo "RESOLVED DEPENDENCY LIST (compact)"
          echo "============================================================"
          flutter pub deps --style=list
          echo ""
          echo "============================================================"
          echo "MOBILE_SCANNER RESOLVED VERSION"
          echo "============================================================"
          flutter pub deps --style=list | grep -i "mobile_scanner" || echo "mobile_scanner: not found in deps"
          echo ""
          echo "============================================================"
          echo "ML KIT / CAMERA RELATED DEPENDENCIES"
          echo "============================================================"
          flutter pub deps --style=list | grep -iE "mlkit|ml_kit|camera|barcode|google_ml" || echo "No ML Kit / camera deps found at Dart level"
          echo ""
          echo "============================================================"
          echo "pubspec.lock (if generated by pub get)"
          echo "============================================================"
          cat pubspec.lock 2>/dev/null || echo "pubspec.lock: not present"

      # ── Build DEBUG APK only ─────────────────────────────────────────────────
      - name: Build DEBUG APK
        working-directory: apps/consumer
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE=https://api-production-266c.up.railway.app/api/v1

      - name: Verify debug APK exists
        run: |
          APK_PATH="apps/consumer/build/app/outputs/flutter-apk/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "DEBUG APK produced successfully."
            ls -lh "$APK_PATH"
          else
            echo "ERROR: Debug APK not found at expected path."
            find apps/consumer/build -name "*.apk" 2>/dev/null || echo "No APK found anywhere in build output."
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tajribti-consumer-debug-diagnostic-${{ github.run_number }}
          path: apps/consumer/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error
