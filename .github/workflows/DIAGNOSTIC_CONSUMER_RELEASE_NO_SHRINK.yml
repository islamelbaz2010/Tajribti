name: "[DIAGNOSTIC] Consumer Android Release — No Shrink"

# TEMPORARY DIAGNOSTIC WORKFLOW — DO NOT MERGE TO main OR sprint/pilot-readiness-mvp
#
# PURPOSE:
#   Isolation test to prove whether R8/code-shrinking is the sole causal factor
#   in the release APK camera failure.
#
# WHAT IS KNOWN:
#   DEBUG APK    → camera preview works  (R8 not active)
#   RELEASE APK  → camera preview fails  (R8 active, ML Kit registrars stripped)
#
# HYPOTHESIS UNDER TEST:
#   RELEASE + shrinking disabled → if camera works, R8 is causally confirmed.
#   This narrows the fix to ProGuard keep rules only (no code changes needed).
#
# APPLICATION CODE, DEPENDENCIES, GRADLE CONFIG: NOT MODIFIED.
# DELETE THIS FILE after the isolation test is complete.

on:
  workflow_dispatch:

jobs:
  build-release-no-shrink:
    name: Build Release APK — Shrinking Disabled (Diagnostic)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      # ── Verify toolchain ────────────────────────────────────────────────────
      - name: Print Flutter version
        run: flutter --version

      # ── Replicates production workflow exactly ──────────────────────────────
      - name: Generate missing Android platform files
        working-directory: apps/consumer
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest_main.xml.bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create --org com.tajribti --platforms android --project-name consumer .
          cp /tmp/AndroidManifest_main.xml.bak android/app/src/main/AndroidManifest.xml
          cp /tmp/pubspec.yaml.bak pubspec.yaml

      - name: Verify AndroidManifest.xml preserved
        working-directory: apps/consumer
        run: |
          echo "=== AndroidManifest.xml ==="
          cat android/app/src/main/AndroidManifest.xml
          echo ""
          grep "CAMERA"  android/app/src/main/AndroidManifest.xml && echo "CAMERA permission: OK"   || echo "ERROR: CAMERA permission missing"
          grep "INTERNET" android/app/src/main/AndroidManifest.xml && echo "INTERNET permission: OK" || echo "ERROR: INTERNET permission missing"
          grep "تجربتي"  android/app/src/main/AndroidManifest.xml && echo "App label (تجربتي): OK"  || echo "ERROR: App label missing"

      - name: Install Flutter dependencies
        working-directory: apps/consumer
        run: flutter pub get

      # ── Diagnostic dependency snapshot ──────────────────────────────────────
      - name: Print resolved dependency list
        working-directory: apps/consumer
        run: |
          echo "============================================================"
          echo "RESOLVED DEPENDENCY LIST"
          echo "============================================================"
          flutter pub deps --style=list
          echo ""
          echo "============================================================"
          echo "mobile_scanner resolved version"
          echo "============================================================"
          flutter pub deps --style=list | grep -i "mobile_scanner" || echo "mobile_scanner: not found"
          echo ""
          echo "============================================================"
          echo "ML Kit / Camera related dependencies"
          echo "============================================================"
          flutter pub deps --style=list | grep -iE "mlkit|ml_kit|camera|barcode|google_ml" || echo "No ML Kit / camera deps found"

      # ── Check whether --no-shrink is a recognised flag ──────────────────────
      # This step is informational. If Flutter 3.44.8 does not recognise
      # --no-shrink, the build step below will fail with a clear error.
      # Per diagnostic instructions: do NOT work around it by modifying Gradle.
      - name: Check --no-shrink flag availability
        working-directory: apps/consumer
        run: |
          echo "============================================================"
          echo "flutter build apk --help (shrink-related flags)"
          echo "============================================================"
          flutter build apk --help 2>&1 | grep -i "shrink" || echo "WARNING: No shrink-related flags found in flutter build apk --help"
          echo ""
          echo "Full help output (for reference):"
          flutter build apk --help 2>&1 || true

      # ── ISOLATION BUILD: Release + shrinking disabled ───────────────────────
      # IMPORTANT: This uses --no-shrink only. No ProGuard rules added.
      # No Gradle configuration modified. No application code changed.
      # If --no-shrink is not supported by Flutter 3.44.8, this step will fail
      # and the error will appear in the CI log. Do not modify Gradle to work
      # around that failure — stop and report instead.
      - name: Build RELEASE APK with shrinking disabled
        working-directory: apps/consumer
        run: |
          echo "============================================================"
          echo "BUILD: flutter build apk --release --no-shrink"
          echo "This is a RELEASE build. Shrinking is explicitly disabled."
          echo "No ProGuard rules. No Gradle changes. No code changes."
          echo "============================================================"
          flutter build apk --release --no-shrink \
            --dart-define=API_BASE=https://api-production-266c.up.railway.app/api/v1

      # ── Verify APK and print metadata ───────────────────────────────────────
      - name: Verify APK exists and print build metadata
        run: |
          APK_PATH="apps/consumer/build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            echo "============================================================"
            echo "RELEASE APK (no-shrink) produced successfully."
            echo "============================================================"
            ls -lh "$APK_PATH"
            echo ""
            echo "Build mode: RELEASE"
            echo "Shrinking:  DISABLED (--no-shrink)"
            echo "ProGuard:   NOT ADDED"
            echo "Gradle:     NOT MODIFIED"
            echo "Source:     NOT MODIFIED"
          else
            echo "ERROR: Release APK not found at expected path."
            find apps/consumer/build -name "*.apk" 2>/dev/null || echo "No APK found anywhere in build output."
            exit 1
          fi

      # ── Confirm diagnostic branch integrity ─────────────────────────────────
      - name: Verify only diagnostic workflow was added (diff vs production branch)
        run: |
          echo "============================================================"
          echo "FILES CHANGED vs sprint/pilot-readiness-mvp"
          echo "============================================================"
          git fetch origin sprint/pilot-readiness-mvp 2>/dev/null || true
          git diff origin/sprint/pilot-readiness-mvp..HEAD --name-only || \
            git diff sprint/pilot-readiness-mvp..HEAD --name-only 2>/dev/null || \
            echo "(Could not diff against remote — local diff shown instead)"
          echo ""
          echo "Expected: only .github/workflows/DIAGNOSTIC_CONSUMER_RELEASE_NO_SHRINK.yml"

      - name: Upload release-no-shrink APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tajribti-consumer-release-no-shrink-${{ github.run_number }}
          path: apps/consumer/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error
