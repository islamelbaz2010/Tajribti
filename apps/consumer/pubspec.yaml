name: consumer
description: Tajribti Consumer App — RTL Arabic, QR-based product trials

publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  mobile_scanner: ^5.1.0
  shared_preferences: ^2.2.2
  go_router: ^13.2.0
  google_fonts: ^6.1.0
  url_launcher: ^6.3.0
  akedly_shield:
    git:
      url: https://github.com/Akedly-Org/akedly-shield-dart.git
      ref: '1.1.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# flutter_web_auth_2 3.x (pulled by akedly_shield 1.1.0) uses the deprecated
# Android v1 plugin API (Registrar/messenger) which fails to compile under
# Flutter 3.44.8. Version 4.0.0 removed v1 embedding. 4.1.0 is stable (20 months),
# API-compatible with the one call akedly_shield makes:
#   FlutterWebAuth2.authenticate(url:, callbackUrlScheme:)
# PoW (solver.dart) has zero dependency on flutter_web_auth_2 — crypto only.
dependency_overrides:
  flutter_web_auth_2: '4.1.0'

flutter:
  uses-material-design: true
